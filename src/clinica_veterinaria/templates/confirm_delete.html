{% extends 'base.html' %}

{% block content %}
    <h1 style="color: red;">Confirmar Eliminação</h1>

    <p>Tem a certeza absoluta que deseja eliminar o registo "<strong>{{ object }}</strong>"?</p>
    <p><em>Aviso: Esta ação não pode ser desfeita.</em></p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit" style="background: red; color: white; padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer;">Sim, eliminar definitivamente</button>
        <a href="javascript:history.back()">Não, cancelar</a>
    </form>
{% endblock %}

<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registar Animal</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .form-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }
        h2 {
            color: #2c5f85;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #444;
        }
        .form-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .form-input:focus {
            border-color: #2c5f85;
            outline: none;
        }
        .btn-container {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }
        .btn-submit {
            background-color: #2c5f85;
            color: white;
        }
        .btn-submit:hover { background-color: #1e4563; }
        .btn-cancel {
            background-color: #e74c3c;
            color: white;
        }
        .btn-cancel:hover { background-color: #c0392b; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Registar Novo Animal</h2>
    
    <form method="POST">
        {% csrf_token %}
        
        {% if form.non_field_errors %}
            <div style="color: red; margin-bottom: 15px;">
                {{ form.non_field_errors }}
            </div>
        {% endif %}

        {% for field in form %}
            <div class="form-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <span style="color: red; font-size: 12px;">{{ field.errors }}</span>
                {% endif %}
            </div>
        {% endfor %}
        
        <div class="btn-container">
            <button type="submit" class="btn btn-submit">Gravar</button>
            <a href="{% url 'perfil' %}" class="btn btn-cancel">Cancelar</a>
        </div>
    </form>
</div>

</body>
</html>

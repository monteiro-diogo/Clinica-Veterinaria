{% load static %}
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Patudos | Clínica Veterinária</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body>

    <!-- Decoração de fundo -->
    <div class="particles" aria-hidden="true">
        <div class="particle" style="width:80px;height:80px;left:10%;animation-duration:18s;animation-delay:0s;"></div>
        <div class="particle" style="width:50px;height:50px;left:25%;animation-duration:22s;animation-delay:4s;"></div>
        <div class="particle" style="width:100px;height:100px;left:60%;animation-duration:15s;animation-delay:2s;"></div>
        <div class="particle" style="width:60px;height:60px;left:80%;animation-duration:20s;animation-delay:6s;"></div>
    </div>
    <div class="hero-glow" aria-hidden="true"></div>
    <div class="bg-circle bg-circle-1" aria-hidden="true"></div>
    <div class="bg-circle bg-circle-2" aria-hidden="true"></div>

    <div class="login-wrapper">

        <!-- Logo -->
        <a href="{% url 'core:home' %}" class="login-logo">
            <div class="logo-paw">🐾</div>
            <div class="logo-text-wrap">
                <h1>Patudos</h1>
                <span>Medicina Veterinária</span>
            </div>
        </a>

        <!-- Card -->
        <div class="login-box">
            <h2>Bem-vindo de volta</h2>
            <p>Introduza as suas credenciais para aceder</p>

            <form method="POST">
                {% csrf_token %}

                <input type="hidden" name="next" value="{{ next|default:'' }}">
                
                <div class="input-group">
                    <label for="username">Utilizador</label>
                    <input type="text" name="username" id="username" placeholder="O seu username" required>
                </div>

                <div class="input-group">
                    <label for="password">Palavra-passe</label>
                    <input type="password" name="password" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-submit">Entrar na Clínica</button>
            </form>

            {% if error %}
                <p class="error-general">{{ error }}</p>
            {% endif %}

            <div class="divider"><span>ou</span></div>

            <div class="footer-links">
                <p>Não tem conta? <a href="{% url 'core:registo' %}">Registe-se aqui</a></p>
                <a href="{% url 'core:home' %}">← Voltar ao Início</a>
            </div>
        </div>

    </div>

</body>
</html>

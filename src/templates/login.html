{% load static %}
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Login - Clínica Veterinária</title>
    <link rel="stylesheet" href="{% static 'css/style_form.css' %}">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h2>Bem-vindo de volta</h2>
            <p>Introduza as suas credenciais para aceder</p>
            
            <form method="POST">
                {% csrf_token %}
                
                <div class="input-group">
                    <label for="username">Utilizador</label>
                    <input type="text" name="username" id="username" placeholder="O seu username" required>
                </div>

                <div class="input-group">
                    <label for="password">Palavra-passe</label>
                    <input type="password" name="password" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-submit">Entrar na Clínica</button>
            </form>

            {% if error %}
                <p class="error-general">{{ error }}</p>
            {% endif %}
            
            <div class="footer-links">
                <p>Não tem conta? <a href="{% url 'registo' %}">Registe-se aqui</a></p>
                <a href="{% url 'home' %}">← Voltar ao Início</a>
            </div>
        </div>
    </div>
</body>
</html>
